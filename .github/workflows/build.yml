name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        # N-21（v1.6.73 收口）：**CI 与生产构建工具链统一为 go1.26.4**。
        # 此前 CI=go1.25 vs 生产=go1.26.4 ⇒ CI 产物与部署件**永远哈希不同**，
        # 外部无法用 CI 产物做逐字节校验（「哈希差异 ≠ 代码差异」被工具链污染）。
        # 注意：统一工具链后仍须**同侧归一**才可逐字节比对（`-buildvcs` 的 VCS 戳受
        # checkout 状态影响：干净提交 vs 脏工作区，见 N-15/N-17）。
        with: { go-version: '1.26.4' }

      # v1.6.73 S2（A-7 升级）+ N-21 收口：**全仓 gofmt 门禁（无排除项）**。
      # 取代 v1.6.72 的"仅改动文件"过渡门禁（其空列表形态曾为空真，见 N-9 教训）。
      # cmd/_deprecated 已格式化干净 ⇒ **排除名单取消**（该项此前是唯一排除项）。
      # 非空真守卫：先对枚举到的文件数做下限断言，避免"枚举为空 ⇒ gofmt -l 空跑 ⇒ 恒绿"。
      - name: gofmt (repo-wide, no exclusion)
        run: |
          set -euo pipefail
          FILES="$(git ls-files '*.go')"
          FN="$(printf '%s\n' "$FILES" | grep -c . || true)"
          if [ "${FN:-0}" -lt 50 ]; then
            echo "::error::仅枚举到 ${FN} 个 .go 文件（异常，期望 ~100）⇒ 门禁可能空真"
            exit 1
          fi
          OUT="$(gofmt -l $FILES || true)"
          if [ -n "$OUT" ]; then
            echo "::error::以下 $(( $(printf '%s\n' "$OUT" | grep -c .) )) 个文件未通过 gofmt（应为 0）："
            echo "$OUT"
            exit 1
          fi
          echo "✅ gofmt：全仓 ${FN} 个 .go 文件，漂移 0（无排除项）"

      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        # N-21（v1.6.73 收口）：同上，统一 go1.26.4（此前为 1.25）
        with: { go-version: '1.26.4' }

      - name: Read version
        id: ver
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build Manager (linux/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/manager
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER} -X main.installerVersion=1.0.0" \
            -o ../../build/ddns-manager .

      - name: Build Agent (linux/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-linux-amd64 .

      - name: Build Agent (linux/arm64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-linux-arm64 .

      - name: Build Agent (windows/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-windows-amd64.exe .

      - name: Generate SHA256
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd build
          sha256sum node-agent-linux-amd64 | awk '{print $1}' > node-agent-linux-amd64.sha256
          sha256sum node-agent-linux-arm64 | awk '{print $1}' > node-agent-linux-arm64.sha256
          sha256sum node-agent-windows-amd64.exe | awk '{print $1}' > node-agent-windows-amd64.exe.sha256

      - name: Verify
        run: |
          ./build/ddns-manager -version
          ./build/node-agent-linux-amd64 -version

      - uses: actions/upload-artifact@v4
        with:
          name: ddns-manager-v${{ steps.ver.outputs.VERSION }}
          path: build/*
          retention-days: 30
