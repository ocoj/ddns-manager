name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      # v1.6.73 S2（A-7 升级）：**全仓 gofmt 门禁** —— 显式枚举 + 数量断言 + 排除项独立断言。
      # 取代 v1.6.72 的"仅改动文件"过渡门禁（其空列表形态曾为空真，见 N-9 教训）。
      # 口径：排除 cmd/_deprecated（已知漂移，仅记录，不格式化 —— 该目录不参与发布链）。
      - name: gofmt (repo-wide, excl. cmd/_deprecated)
        run: |
          set -euo pipefail
          OUT="$(gofmt -l internal/ cmd/ || true)"
          EXC="$(printf '%s\n' "$OUT" | grep '^cmd/_deprecated/' | grep . || true)"
          REST="$(printf '%s\n' "$OUT" | grep -v '^cmd/_deprecated/' | grep . || true)"
          EXC_N="$(printf '%s\n' "${EXC:-}" | grep -c . || true)"
          echo "排除项（cmd/_deprecated，仅记录）: ${EXC_N}"
          [ -n "$EXC" ] && echo "$EXC"
          if [ -n "$REST" ]; then
            echo "::error::以下文件未通过 gofmt（应为 0）："; echo "$REST"; exit 1
          fi
          # 排除项必须仍存在：若 _deprecated 被删/改名，本门禁的排除断言将静默失效 ⇒ 显式失败
          if [ "${EXC_N:-0}" -lt 1 ]; then
            echo "::error::cmd/_deprecated 漂移项为 0 —— 目录可能被删除/改名，本门禁需同步更新（防静默失效）"
            exit 1
          fi
          echo "✅ gofmt：非排除漂移 0；排除项 ${EXC_N}（已知）"

      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Read version
        id: ver
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build Manager (linux/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/manager
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER} -X main.installerVersion=1.0.0" \
            -o ../../build/ddns-manager .

      - name: Build Agent (linux/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-linux-amd64 .

      - name: Build Agent (linux/arm64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-linux-arm64 .

      - name: Build Agent (windows/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-windows-amd64.exe .

      - name: Generate SHA256
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd build
          sha256sum node-agent-linux-amd64 | awk '{print $1}' > node-agent-linux-amd64.sha256
          sha256sum node-agent-linux-arm64 | awk '{print $1}' > node-agent-linux-arm64.sha256
          sha256sum node-agent-windows-amd64.exe | awk '{print $1}' > node-agent-windows-amd64.exe.sha256

      - name: Verify
        run: |
          ./build/ddns-manager -version
          ./build/node-agent-linux-amd64 -version

      - uses: actions/upload-artifact@v4
        with:
          name: ddns-manager-v${{ steps.ver.outputs.VERSION }}
          path: build/*
          retention-days: 30
