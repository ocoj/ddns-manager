name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      # S1-0 过渡门禁（v1.6.72 补丁 v2）：只检查**本次改动**的 .go 文件是否 gofmt 干净。
      # 说明（N-9 教训）：`gofmt -l <空列表>` 恒为真 ⇒ 必须先构造**非空**文件列表并显式断言，
      #   否则该门禁在"无改动/未提交"时形同不存在（空真）。
      # 待 S2 升级为「全仓漂移白名单 + 数量断言（显式枚举，排除 cmd/_deprecated）」。
      - name: gofmt (changed files only)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          FILES="$(git diff --name-only "$BASE" HEAD -- '*.go' | grep -v '^cmd/_deprecated/' || true)"
          if [ -z "$FILES" ]; then
            echo "::notice::本次无改动的 .go 文件 ⇒ 该门禁无判别对象（**显式声明**，非静默通过）"
            exit 0
          fi
          echo "检查文件："; echo "$FILES"
          OUT="$(gofmt -l $FILES)"
          if [ -n "$OUT" ]; then
            echo "::error::以下改动文件未通过 gofmt："; echo "$OUT"; exit 1
          fi
          echo "✅ gofmt 通过（改动文件 ${FILES}）"

      - run: go test ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with: { go-version: '1.25' }

      - name: Read version
        id: ver
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build Manager (linux/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/manager
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER} -X main.installerVersion=1.0.0" \
            -o ../../build/ddns-manager .

      - name: Build Agent (linux/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-linux-amd64 .

      - name: Build Agent (linux/arm64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-linux-arm64 .

      - name: Build Agent (windows/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-windows-amd64.exe .

      - name: Generate SHA256
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd build
          sha256sum node-agent-linux-amd64 | awk '{print $1}' > node-agent-linux-amd64.sha256
          sha256sum node-agent-linux-arm64 | awk '{print $1}' > node-agent-linux-arm64.sha256
          sha256sum node-agent-windows-amd64.exe | awk '{print $1}' > node-agent-windows-amd64.exe.sha256

      - name: Verify
        run: |
          ./build/ddns-manager -version
          ./build/node-agent-linux-amd64 -version

      - uses: actions/upload-artifact@v4
        with:
          name: ddns-manager-v${{ steps.ver.outputs.VERSION }}
          path: build/*
          retention-days: 30
