name: Release

on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        # N-21（v1.6.73 **收口**）：CI 工具链已**统一为 go1.26.4**，与生产部署件同工具链
        # （见 ~/ddns-backups/*/PROVENANCE.txt 的 toolchain / ci_toolchain 字段，二者现相同）。
        # ⇒ 此前「CI 产物与部署件永远哈希不同」的干扰已消除；但逐字节比对仍须**同侧归一**
        #   （`-buildvcs=false`），因 VCS 戳受 checkout 状态影响（干净提交 vs 脏工作区，N-15/N-17）。
        with: { go-version: '1.26.4' }

      - name: Read version
        id: ver
        run: echo "VERSION=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build Manager (linux/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/manager
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER} -X main.installerVersion=1.0.0" \
            -o ../../build/ddns-manager .

      - name: Build Agent (linux/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-linux-amd64 .

      - name: Build Agent (linux/arm64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-linux-arm64 .

      - name: Build Agent (windows/amd64)
        env: { VER: "${{ steps.ver.outputs.VERSION }}" }
        run: |
          cd cmd/agent
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X main.version=${VER}" \
            -o ../../build/node-agent-windows-amd64.exe .

      - name: Generate SHA256
        run: |
          cd build
          sha256sum node-agent-linux-amd64 | awk '{print $1}' > node-agent-linux-amd64.sha256
          sha256sum node-agent-linux-arm64 | awk '{print $1}' > node-agent-linux-arm64.sha256
          sha256sum node-agent-windows-amd64.exe | awk '{print $1}' > node-agent-windows-amd64.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: assets
          path: build/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: assets
          path: build

      - name: Prepare release assets
        env: { VER: "${{ needs.build.outputs.version }}" }
        run: |
          cd build
          mv ddns-manager ddns-manager-v${VER}-linux-amd64
          # v1.6.72 P9：Manager 的 .sha256 必须在**版本化改名之后**生成，
          # 否则哈希的是未版本化名 `ddns-manager`，与附件名不符（校验必然不一致）。
          # 格式与既有 3 个 Agent 一致：**纯哈希**（`awk '{print $1}'`，无文件名）。
          sha256sum ddns-manager-v${VER}-linux-amd64 | awk '{print $1}' > ddns-manager-v${VER}-linux-amd64.sha256
          mv node-agent-linux-amd64 node-agent-v${VER}-linux-amd64
          mv node-agent-linux-amd64.sha256 node-agent-v${VER}-linux-amd64.sha256
          mv node-agent-linux-arm64 node-agent-v${VER}-linux-arm64
          mv node-agent-linux-arm64.sha256 node-agent-v${VER}-linux-arm64.sha256
          mv node-agent-windows-amd64.exe node-agent-v${VER}-windows-amd64.exe
          mv node-agent-windows-amd64.exe.sha256 node-agent-v${VER}-windows-amd64.exe.sha256
          ls -lh

      - name: Extract changelog
        id: changelog
        env: { VER: "${{ needs.build.outputs.version }}" }
        run: |
          # v1.6.71 修复: 原 `awk "/^## v${VER}/,"`(range 缺第二模式) 是 awk 语法错误
          # ⇒ 提取结果为空 ⇒ Release 正文只剩下方追加的 SHA256 块（v1.6.69 及更早同样受影响）。
          # 正确写法: sed 地址范围(含末行 ---) → 去标题行 → 去末行 ---
          sed -n "/^## v${VER}/,/^---$/p" CHANGELOG.md | tail -n +2 | sed '$d' > release-body.md
          echo "---" >> release-body.md
          echo "" >> release-body.md
          echo "### SHA256" >> release-body.md
          echo '```' >> release-body.md
          # N-27（v1.6.73 #5）：正文 SHA256 块**纳入 Manager**（此前只有 3 个 Agent ⇒ Manager 的
          # .sha256 仅作资产出现，正文里查不到）。改为单条 cat、**去手工拼块**。
          # 顺序固定：Manager → Agent linux/amd64 → linux/arm64 → windows/amd64。
          # 口径：CI 发布侧为**纯哈希**（无文件名，见上方 `awk '{print $1}'`）⇒ 本块即按上述顺序的 4 行哈希。
          cat build/ddns-manager-v${VER}-linux-amd64.sha256 build/node-agent-v${VER}-*.sha256 >> release-body.md
          echo '```' >> release-body.md
          cat release-body.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          files: build/*
          fail_on_unmatched_files: true

  docker:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        # N-21（v1.6.73 收口）：同 build job —— 统一 go1.26.4
        with: { go-version: '1.26.4' }

      - name: Build binary
        env: { VER: "${{ needs.build.outputs.version }}" }
        run: |
          CGO_ENABLED=0 go build -trimpath \
            -ldflags="-s -w -X main.version=${VER} -X main.installerVersion=1.0.0" \
            -o ddns-manager ./cmd/manager

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
