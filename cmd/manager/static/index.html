async function batchUpgrade() {
  var cbs = document.querySelectorAll('.node-upgrade-cb:checked');
  if (cbs.length === 0) { toast('请选择节点', 'warning'); return; }
  clearInterval(refreshTimer);
  var count = 0;
  // 预填充 _upgState，loadVersions 重渲染时能看到等待中状态
  if (!window._upgState) window._upgState = {};
  for (var i = 0; i < cbs.length; i++) {
    var nodeId = cbs[i].value;
    var sel = document.querySelector('.upgrade-target[data-node="' + nodeId + '"]');
    var targetVer = sel ? sel.value : '';
    if (!targetVer) continue;
    // 立即显示等待中状态（不被后续 loadVersions 覆盖）
    window._upgState[nodeId] = {target_ver: targetVer, triggered: new Date().toISOString(), completed: ''};
    try {
      await apiJSON('/api/admin/agent-version', {method: 'POST', body: {latest_version: targetVer}});
      count++;
    } catch(e) {
      delete window._upgState[nodeId];
    }
  }
  startAutoRefresh();
  if (count > 0) { toast('已触发 ' + count + ' 个节点升级，等待心跳确认 (~5min 内)'); loadVersions(); }
  else toast('未选择目标版本', 'warning');
}

// ==================== LOGS (v1.6.19: 增量追加 + 滚动保持) ====================
let _lastLogTime = '';


// 增量加载: 取新日志, prepend到表格顶部, 旧数据自然下移
async function loadLogsIncremental() {
  try {
    var url = '/api/admin/logs?limit=50';
    var r = await apiJSON(url);
    if (!r.ok || !r.data || !r.data.events) return;
    var events = normalizeEvents(r.data.events || []);
    if (events.length === 0) return;
    var tbody = document.querySelector('#page-logs tbody');
    if (!tbody) { await loadLogs(true); return; }
    // 获取现有首行时间作为"已显示"标记
    var firstRow = tbody.querySelector('tr');
    var firstTime = firstRow ? firstRow.querySelector('td')?.textContent?.trim() : '';
    // API已返回倒序(最新在顶), 正向遍历取新条目
    var newRows = [];
    for (var i = 0; i < events.length; i++) {
      var l = events[i];
      var ts = fmtTime(l.time);
      var ts2 = ts.length > 10 ? ts.substring(11,16) : ts;
      if (ts === firstTime) break;
      var badgeCls = l.status === 'error' ? 'badge-red' : (l.status === 'success' ? 'badge-green' : 'badge-blue');
      newRows.push('<tr class="log-row"><td class="col-log-time"><span class="log-time-full">' + ts + '</span><span class="log-time-short">' + ts2 + '</span></td><td class="col-log-node">' + he(l.node || '-') + '</td>');
      newRows.push('<td class="col-log-cat"><span class="badge ' + badgeCls + '">' + he(l.category) + '</span></td>');
      newRows.push('<td class="col-log-content">' + he(l.action + ' ' + l.detail) + '</td></tr>');
    }
    if (newRows.length === 0) return;
    // prepend 新行到表顶
    tbody.insertAdjacentHTML('afterbegin', newRows.join(''));
    // 限制最多200行
    var allRows = tbody.querySelectorAll('tr');
    while (allRows.length > 200) { allRows[allRows.length-1].remove(); allRows = tbody.querySelectorAll('tr'); }
  } catch(e) { /* ignore */ }
}


// 全量加载 (切页/手动搜索时使用)
async function loadLogs(silent, filter) {
  if (!silent) document.getElementById('page-logs').innerHTML = '<div class="empty">加载中...</div>';
  try {
    var url = '/api/admin/logs?limit=500';
    if (filter) {
      if (filter.node) url += '&node=' + encodeURIComponent(filter.node);
      if (filter.category) url += '&category=' + encodeURIComponent(filter.category);
      if (filter.from) url += '&from=' + encodeURIComponent(filter.from);
      if (filter.to) url += '&to=' + encodeURIComponent(filter.to);
    }
    var r = await apiJSON(url);
    if (!r.ok) return;
    // also load nodes for the node filter dropdown
    var nr = await apiJSON('/api/admin/nodes').catch(function(){ return {ok:true,data:{}}; });
    var nodeNames = [];
    if (nr.data) {
      Object.keys(nr.data).forEach(function(id) {
        var hw = nr.data[id].hardware || {};
        var host = hw.hostname || id;
        nodeNames.push({id: id, label: host + ' (' + id + ')'});
      });
    }
    window._logNodeNames = nodeNames;
    renderLogs(r.data, filter);
  } catch(e) { if (!silent) document.getElementById('page-logs').innerHTML = '<div class="empty">加载失败</div>'; }
}
function renderLogs(data, filter) {
  var events = normalizeEvents((data && data.events) || []);
  var categories = (data && data.categories) || [];
  var nodeNames = window._logNodeNames || [];
  var f = filter || {};
  var h = '';
  h += '<div class="card"><div class="card-header"><h3>系统日志 <span style="font-size:11px;color:var(--c-text2);font-weight:400">(' + (window._tzLabel || '') + ')</span></h3><button class="btn btn-sm log-filter-toggle" onclick="toggleLogFilter()">筛选 ▾</button></div>';
  h += '<div class="form-inline log-filter-bar" style="margin-bottom:12px;gap:6px;align-items:flex-end">';
  h += '<div class="form-group" style="flex:0 1 130px"><label>节点</label><select id="log-filter-node"><option value="">全部</option>';
  nodeNames.forEach(function(n) {
    h += '<option value="' + he(n.id) + '"' + (f.node === n.id ? ' selected' : '') + '>' + he(n.label) + '</option>';
  });
  h += '</select></div>';
  h += '<div class="form-group" style="flex:0 1 110px"><label>分类</label><select id="log-filter-cat"><option value="">全部</option>';
  categories.forEach(function(c) {
    h += '<option value="' + he(c) + '"' + (f.category === c ? ' selected' : '') + '>' + he(c) + '</option>';
  });
  h += '</select></div>';
  h += '<div class="form-group" style="flex:0 1 120px"><label>开始</label><input type="date" id="log-filter-from" value="' + he(f.from || '') + '" style="font-size:11px"></div>';
  h += '<div class="form-group" style="flex:0 1 120px"><label>结束</label><input type="date" id="log-filter-to" value="' + he(f.to || '') + '" style="font-size:11px"></div>';
  h += '<div class="form-group" style="flex:0 0 auto"><label style="visibility:hidden">.</label><button class="btn btn-primary" onclick="applyLogFilter()">搜索</button></div>';
  h += '<div class="form-group" style="flex:0 0 auto"><label style="visibility:hidden">.</label><button class="btn" onclick="resetLogFilter()">重置</button></div>';
  h += '<div class="form-group" style="flex:0 0 auto"><label style="visibility:hidden">.</label><button class="btn" onclick="downloadLogs()">下载</button></div>';
  h += '<div class="form-group" style="flex:0 0 auto"><label style="visibility:hidden">.</label><button class="btn btn-danger" onclick="cleanupLogs()">清理</button></div>';
  h += '</div>';
  h += '<div class="log-table-wrap"><table class="log-table"><thead><tr><th class="col-log-time">时间</th><th class="col-log-node">节点</th><th class="col-log-cat">分类</th><th>内容</th></tr></thead><tbody>';
  if (events.length === 0) {
    h += '<tr><td colspan="4" class="empty">暂无日志</td></tr>';
  } else {
    events.forEach(function(l) {
      var badgeCls = l.status === 'error' ? 'badge-red' : (l.status === 'success' ? 'badge-green' : 'badge-blue');
      var timeFull = fmtTime(l.time);
      var timeShort = timeFull.length > 10 ? timeFull.substring(11,16) : timeFull;
      h += '<tr class="log-row"><td class="col-log-time"><span class="log-time-full">' + timeFull + '</span><span class="log-time-short">' + timeShort + '</span></td><td class="col-log-node">' + he(l.node || '-') + '</td>';
      h += '<td class="col-log-cat"><span class="badge ' + badgeCls + '">' + he(l.category) + '</span></td>';
      h += '<td class="col-log-content">' + he(l.action + ' ' + l.detail) + '</td></tr>';
    });
  }
  h += '</tbody></table></div></div>';
  document.getElementById('page-logs').innerHTML = h;
}
function getLogFilter() {
  return {
    node: document.getElementById('log-filter-node') ? document.getElementById('log-filter-node').value : '',
    category: document.getElementById('log-filter-cat') ? document.getElementById('log-filter-cat').value : '',
    from: document.getElementById('log-filter-from') ? document.getElementById('log-filter-from').value : '',
    to: document.getElementById('log-filter-to') ? document.getElementById('log-filter-to').value : ''
  };
}
function applyLogFilter() { var f = getLogFilter(); window._logFilter = f; loadLogs(false, f); }
function resetLogFilter() { window._logFilter = null; document.getElementById('log-filter-node').value=''; document.getElementById('log-filter-cat').value=''; document.getElementById('log-filter-from').value=''; document.getElementById('log-filter-to').value=''; loadLogs(false); }
function toggleLogFilter() { var b = document.querySelector('.log-filter-bar'); if (b) { b.classList.toggle('open'); var t = document.querySelector('.log-filter-toggle'); if (t) t.textContent = b.classList.contains('open') ? '筛选 ▴' : '筛选 ▾'; } }
async function cleanupLogs() {
  confirmAction('清理日志', '确定清理旧日志？', function() {
    apiJSON('/api/admin/logs/cleanup', {method: 'POST'}).then(function(r) {
      if (r.ok) { toast('已清理'); loadLogs(); }
    });
  });
}
async function downloadLogs() {
  try {
    var r = await api('/api/admin/logs/download');
    if (!r.ok) { toast('下载失败', 'error'); return; }
    var blob = await r.blob();
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'ddns-manager-logs.tar.gz';
    a.click();
    URL.revokeObjectURL(url);
    toast('下载完成');
  } catch(e) { toast('下载失败', 'error'); }
}

// ==================== SETTINGS ====================
async function loadSettings(silent) {
  if (!silent) document.getElementById('page-settings').innerHTML = '<div class="empty">加载中...</div>';
  try {
    var sr = await apiJSON('/api/admin/smtp');
    var rr = await apiJSON('/api/admin/rate-limit');
    var tr = await apiJSON('/api/admin/timezone');
    renderSettings(sr.data || {}, rr.data || {}, (tr.data || {}).timezone || 'Asia/Shanghai');
  } catch(e) { if (!silent) document.getElementById('page-settings').innerHTML = '<div class="empty">加载失败</div>'; }
}
function renderSettings(smtp, rl, tz) {
  var h = '';
  h += '<div class="card"><div class="card-header"><h3>时区</h3></div>';
  h += '<div class="form-inline"><div class="form-group"><label>管理端时区</label><select id="tz-select">';
  ['Asia/Shanghai','Asia/Tokyo','Asia/Seoul','Asia/Singapore','Asia/Kolkata','Asia/Dubai','Europe/London','Europe/Berlin','Europe/Moscow','America/New_York','America/Chicago','America/Los_Angeles','Australia/Sydney','Pacific/Auckland','UTC'].forEach(function(t){
    h += '<option value="'+t+'"'+(t===tz?' selected':'')+'>'+t.replace(/_/g,' ')+'</option>';
  });
  h += '</select></div><div class="form-group"><label>&nbsp;</label><button class="btn btn-primary" onclick="saveTimezone()">保存</button></div></div>';
  h += '<div class="tip" style="margin-top:4px">影响仪表盘图表时间轴、日志时间显示</div></div>';
  // 记录时区到全局变量，UI 时间显示使用
  window._tz = tz;
  // 修改密码
  h += '<div class="card"><div class="card-header"><h3>修改密码</h3></div>';
  h += '<div class="form-inline"><div class="form-group"><label>新密码</label><div style="display:flex;gap:8px"><input type="password" id="set-new-pwd" placeholder="新密码" style="flex:1"><input type="password" id="set-confirm-pwd" placeholder="确认密码" style="flex:1"></div></div>';
  h += '<div class="form-group"><label>&nbsp;</label><button class="btn btn-primary" onclick="changePassword()">保存</button></div></div></div>';

  h += '<div class="card"><div class="card-header"><h3>SMTP 邮件通知</h3></div>';
  // 第一行: 发件人 + 授权码
  h += '<div class="form-row"><div class="form-group"><label>发件人</label><input id="smtp-user" value="' + he(smtp.username || '') + '" placeholder="user@qq.com" oninput="autoMatchSMTP()"></div>';
  h += '<div class="form-group"><label>授权码</label><input type="password" id="smtp-pass" value="' + he(smtp.password || '') + '" placeholder="留空不变"></div></div>';
  // 第二行: SMTP服务器(智能匹配下拉) + 端口
  h += '<div class="form-row"><div class="form-group"><label>SMTP 服务器</label><select id="smtp-host-sel" onchange="onSMTPHostChange()"><option value="">-- 自动匹配或手动选择 --</option></select><input id="smtp-host" value="' + he(smtp.host || '') + '" placeholder="smtp.qq.com" style="display:none;margin-top:4px"></div>';
  h += '<div class="form-group"><label>端口</label><input id="smtp-port" value="' + he(smtp.port || '465') + '" style="width:100px"></div></div>';
  // 第三行: 收件人 + 管理端域名
  h += '<div class="form-row"><div class="form-group"><label>收件人</label><input id="smtp-to" value="' + he(smtp.to || '') + '" placeholder="admin@example.com"></div>';
  h += '<div class="form-group"><label>管理端域名</label><input id="smtp-mgr-url" value="' + he(smtp.manager_url || '') + '" placeholder="如 https://manager.example.com:30443"><div class="tip">邮件中可点击的管理端链接，留空使用服务器 IP:端口</div></div></div>';
  // 第四行: 证书告警天数 (独立一行)
  h += '<div class="form-row"><div class="form-group"><label>证书告警天数</label><input id="smtp-cert-days" value="' + he(smtp.cert_expiry_days || '7') + '" style="width:80px"></div></div>';
  h += '<div style="margin:12px 0"><b style="font-size:12px;color:var(--c-text2)">通知事件:</b></div><div class="form-row">';
  var evs = [{k:'notify_heartbeat_fail',v:'心跳失败'},{k:'notify_security',v:'安全事件'},{k:'notify_config_change',v:'配置变更'},{k:'notify_system_error',v:'系统错误'},{k:'notify_cert_expiry',v:'证书到期'}];
  evs.forEach(function(ev) {
    h += '<label class="checkbox-row"><input type="checkbox" id="smtp-' + ev.k + '" class="smtp-event" value="' + ev.k + '"' + (smtp[ev.k] ? ' checked' : '') + '> ' + ev.v + '</label>';
  });
  h += '</div><div class="btn-row" style="margin-top:16px"><button class="btn" onclick="testSMTP()">测试发送</button><button class="btn btn-primary" onclick="saveSMTP()">保存</button></div></div>';

  h += '<div class="card"><div class="card-header"><h3>访问限流</h3></div>';
  h += '<div class="form-inline"><div class="form-group"><label>全局 (req/min)</label><input id="rl-global" value="' + he(rl.requests_per_min || '600') + '" style="width:90px"></div>';
  h += '<div class="form-group"><label>心跳 (req/min)</label><input id="rl-heartbeat" value="' + he(rl.heartbeat_per_min || '120') + '" style="width:90px"></div>';
  h += '<div class="form-group"><label>登录 (req/min)</label><input id="rl-login" value="' + he(rl.login_per_min || '10') + '" style="width:90px"></div></div>';
  h += '<label class="checkbox-row" style="margin:8px 0"><input type="checkbox" id="rl-enabled"' + (rl.enabled ? ' checked' : '') + '> 启用限流</label>';
  h += '<div class="tip">基于真实客户端IP，兼容NPM反代</div>';
  h += '<div class="btn-row" style="margin-top:8px"><button class="btn btn-primary" onclick="saveRateLimit()">保存</button></div></div>';

  document.getElementById('page-settings').innerHTML = h;

async function changePassword() {
  var p1 = document.getElementById('set-new-pwd').value;
  var p2 = document.getElementById('set-confirm-pwd').value;
  if (!p1) { toast('请输入新密码', 'error'); return; }
  if (p1 !== p2) { toast('两次密码不一致', 'error'); return; }
  var r = await apiJSON('/api/admin/change-password', {method: 'POST', body: {new_password: p1}});
  if (r.ok) { toast('密码已修改'); markPageClean(); document.getElementById('set-new-pwd').value = ''; document.getElementById('set-confirm-pwd').value = ''; }
}
async function saveSMTP() {
  var hostEl = document.getElementById('smtp-host');
  var selEl = document.getElementById('smtp-host-sel');
  // 获取host: 如果下拉可见取下拉值(自定义时读输入框), 如果下拉隐藏取输入框值
  var host = selEl.offsetParent ? (selEl.value === '__custom__' ? hostEl.value : selEl.value) : hostEl.value;
  var body = {
    host: host || '',
    port: parseInt(document.getElementById('smtp-port').value) || 465,
    username: document.getElementById('smtp-user').value,
    password: document.getElementById('smtp-pass').value,
    to: document.getElementById('smtp-to').value,
    manager_url: document.getElementById('smtp-mgr-url').value,
    cert_expiry_days: parseInt(document.getElementById('smtp-cert-days').value) || 7
  };
  var cbs = document.querySelectorAll('.smtp-event:checked');
  for (var i = 0; i < cbs.length; i++) body[cbs[i].value] = true;
  var r = await apiJSON('/api/admin/smtp', {method: 'POST', body: body});
  if (r.ok) { toast('SMTP 已保存'); markPageClean(); }
  else { toast('保存失败: ' + ((r.data && r.data.error) || r.status || '未知错误'), 'error'); }
}
async function testSMTP() {
  var r = await apiJSON('/api/admin/smtp/test', {method: 'POST'});
  if (r.ok) toast('测试邮件已发送');
  else toast('发送失败: ' + ((r.data && r.data.error) || r.status || '未知错误'), 'error');
}

// ── SMTP 服务器智能匹配 ──
// 邮箱域名 → SMTP 服务器映射表 (常见国内/国际邮箱)
var SMTP_MAP = {
  'qq.com':      {host:'smtp.qq.com', port:465},
  '163.com':     {host:'smtp.163.com', port:465},
  '126.com':     {host:'smtp.126.com', port:465},
  'outlook.com': {host:'smtp.office365.com', port:587},
  'hotmail.com': {host:'smtp.office365.com', port:587},
  'live.com':    {host:'smtp.office365.com', port:587},
  'gmail.com':   {host:'smtp.gmail.com', port:587},
  'aliyun.com':  {host:'smtp.aliyun.com', port:465},
  'foxmail.com': {host:'smtp.qq.com', port:465},
  'yeah.net':    {host:'smtp.yeah.net', port:465},
  'sina.com':    {host:'smtp.sina.com', port:465},
  'sina.cn':     {host:'smtp.sina.cn', port:465},
  'sohu.com':    {host:'smtp.sohu.com', port:465}
};

function initSMTPDropdown() {
  var sel = document.getElementById('smtp-host-sel');
  if (!sel || sel.options.length > 1) return; // 已初始化
  var hosts = {};
  Object.keys(SMTP_MAP).forEach(function(k) {
    var h = SMTP_MAP[k].host;
    if (!hosts[h]) { hosts[h] = true; sel.appendChild(new Option(h, h)); }
  });
  sel.appendChild(new Option('─ 其他(自定义) ─', '__custom__'));
  // 恢复已保存值
  var savedHost = document.getElementById('smtp-host').value;
  if (savedHost) {
    var found = false;
    for (var i = 0; i < sel.options.length; i++) {
      if (sel.options[i].value === savedHost) { sel.value = savedHost; found = true; break; }
    }
    if (!found) { sel.value = '__custom__'; showCustomSMTPHost(true); }
  }
}

function autoMatchSMTP() {
  var email = document.getElementById('smtp-user').value.trim();
  var at = email.lastIndexOf('@');
  if (at < 0) return;
  var domain = email.substring(at + 1).toLowerCase();
  var m = SMTP_MAP[domain];
  if (!m) return;
  var sel = document.getElementById('smtp-host-sel');
  var hostInput = document.getElementById('smtp-host');
  var portInput = document.getElementById('smtp-port');
  // 自动匹配
  sel.value = m.host;
  showCustomSMTPHost(false);
  hostInput.value = m.host;
  portInput.value = m.port;
}

function onSMTPHostChange() {
  var sel = document.getElementById('smtp-host-sel');
  showCustomSMTPHost(sel.value === '__custom__');
}

function showCustomSMTPHost(show) {
  var sel = document.getElementById('smtp-host-sel');
  var hostInput = document.getElementById('smtp-host');
  if (show) {
    sel.style.display = 'none';
    hostInput.style.display = '';
  } else {
    sel.style.display = '';
    hostInput.style.display = 'none';
    if (sel.value !== '__custom__' && sel.value) hostInput.value = sel.value;
  }
}
async function saveRateLimit() {
  var body = {
    enabled: document.getElementById('rl-enabled').checked,
    requests_per_min: parseInt(document.getElementById('rl-global').value) || 600,
    heartbeat_per_min: parseInt(document.getElementById('rl-heartbeat').value) || 120,
    login_per_min: parseInt(document.getElementById('rl-login').value) || 10
  };
  var r = await apiJSON('/api/admin/rate-limit', {method: 'POST', body: body});
  if (r.ok) { toast('限流已保存'); markPageClean(); }
}

async function saveTimezone() {
  var tz = document.getElementById('tz-select').value;
  var r = await apiJSON('/api/admin/timezone', {method:'POST', body:{timezone:tz}});
  if (r.ok) {
    window._tz = tz;
    window._tzLabel = tz;  // v1.6.25: 同步更新日志标题

// ========== HELPERS ==========
function he(str) {
  if (!str) return '';
  var d = document.createElement('div');
  d.textContent = String(str);
  return d.innerHTML;
}
// jsStr escapes for use inside JS string literals (onclick handlers)
function jsStr(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n');
}

// fmtTime 将 UTC 时间字符串转为配置时区显示
function fmtTime(utcStr) {
  if (!utcStr) return '-';
  // v1.6.24: 兼容 ISO 8601 (Z / +HH:MM), Date直接解析带时区的字符串
  var d = new Date(utcStr);
  if (isNaN(d.getTime())) return utcStr;
  try {
    var tz = window._tz || localStorage.getItem('ddns-tz') || 'Asia/Shanghai';
    var s = d.toLocaleString('sv', {timeZone:tz, hour12:false});
    if (s && s.length > 10) return s;
  } catch(e) {}
  // 兜底: UTC方法格式化
  return d.getUTCFullYear()+'-'+('0'+(d.getUTCMonth()+1)).slice(-2)+'-'+('0'+d.getUTCDate()).slice(-2)+' '+('0'+d.getUTCHours()).slice(-2)+':'+('0'+d.getUTCMinutes()).slice(-2)+':'+('0'+d.getUTCSeconds()).slice(-2);
}

// ═══ 「更多」下拉菜单 ═══
function toggleMore(e) {
  e.stopPropagation();
  var btn = e.currentTarget;
  var menu = btn.nextElementSibling;
  var open = menu.classList.contains('show');
  document.querySelectorAll('.more-menu.show').forEach(function(m) { m.classList.remove('show'); });
  if (!open) {
    // 检测视口空间：下方不够则向上展开，避免被裁切
    menu.style.display = 'block';
    var menuH = menu.offsetHeight;
    menu.style.display = '';
    var rect = btn.getBoundingClientRect();
    if (rect.bottom + menuH > window.innerHeight - 8) {
      menu.style.top = 'auto';
      menu.style.bottom = '100%';
    } else {
      menu.style.top = '100%';
      menu.style.bottom = 'auto';
    }
    menu.classList.add('show');
  }
}
document.addEventListener('click', function() {
  document.querySelectorAll('.more-menu.show').forEach(function(m) { m.classList.remove('show'); });
});

// 登录按钮三重保险: onclick + addEventListener on both button and form
(function() {
  var form = document.getElementById('login-form');
  if (form) {
    form.addEventListener('submit', doLogin);
  }
  var btn = document.getElementById('login-btn');
  if (btn) {
    btn.addEventListener('click', doLogin);
  }
  // 输入框回车也触发
  var pwInput = document.getElementById('login-pwd');
  if (pwInput) {
    pwInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') doLogin(e);
    });
  }
})();
