<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" aria-labelledby="t d">
  <title id="t">DDNS-Manager 架构图</title>
  <desc id="d">管理端 Manager 集中管控 DNS Key、SSL 证书与 Agent 版本；节点 Agent 内嵌 ddns-go DNS 引擎直连 DNS 提供商更新记录。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6ff"/>
      <stop offset="100%" stop-color="#e9f1ff"/>
    </linearGradient>
    <linearGradient id="gradM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="gradD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="a-indigo" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#4f46e5"/></marker>
    <marker id="a-violet" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#7c3aed"/></marker>
    <marker id="a-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#f97316"/></marker>
    <marker id="a-slate" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#64748b"/></marker>
    <marker id="a-amber" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 Z" fill="#f59e0b"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <!-- 光斑 -->
  <circle cx="1060" cy="90" r="210" fill="#c7d2fe" opacity="0.35"/>
  <circle cx="90" cy="700" r="190" fill="#bae6fd" opacity="0.4"/>
  <circle cx="600" cy="430" r="260" fill="#dcfce7" opacity="0.25"/>

  <!-- 标题 -->
  <text x="60" y="52" font-size="27" font-weight="800" fill="#0f172a">DDNS-Manager 架构图</text>
  <text x="60" y="78" font-size="13.5" fill="#64748b">集中管控 DNS Key · SSL 证书 · Agent 版本 · 分布式 DDNS 更新</text>

  <!-- 用户卡 -->
  <g filter="url(#shadow)">
    <rect x="60" y="122" width="220" height="168" rx="16" fill="#ffffff"/>
    <rect x="60" y="122" width="220" height="6" rx="3" fill="#f59e0b"/>
    <text x="170" y="185" font-size="40" text-anchor="middle">👤</text>
    <text x="170" y="224" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">用户 / 浏览器</text>
    <text x="170" y="252" font-size="12.5" fill="#475569" text-anchor="middle">HTTPS · Web 控制台</text>
    <text x="170" y="274" font-size="12.5" fill="#475569" text-anchor="middle">REST API 客户端</text>
  </g>

  <!-- Manager 卡 -->
  <g filter="url(#shadow)">
    <rect x="310" y="122" width="560" height="168" rx="18" fill="url(#gradM)"/>
    <text x="340" y="166" font-size="23" font-weight="800" fill="#ffffff">🖥️ 管理端 · DDNS Manager</text>
    <text x="340" y="194" font-size="14" fill="#ffffff" opacity="0.95">集中管控：DNS Key · SSL 证书 · Agent 版本</text>
    <g font-size="12.5" fill="#ffffff">
      <rect x="340" y="212" width="122" height="30" rx="10" fill="#ffffff" opacity="0.18"/><text x="352" y="231">Web 仪表盘</text>
      <rect x="474" y="212" width="96" height="30" rx="10" fill="#ffffff" opacity="0.18"/><text x="486" y="231">REST API</text>
      <rect x="582" y="212" width="112" height="30" rx="10" fill="#ffffff" opacity="0.18"/><text x="594" y="231">策略 / 审计</text>
    </g>
    <rect x="340" y="252" width="500" height="30" rx="10" fill="#ffffff" opacity="0.16"/>
    <text x="356" y="272" font-size="12.5" fill="#ffffff">🔐 ACME 证书签发 — Let's Encrypt / ZeroSSL / Google Trust</text>
  </g>

  <!-- JSON 卡 -->
  <g filter="url(#shadow)">
    <rect x="900" y="122" width="240" height="168" rx="16" fill="#ffffff"/>
    <rect x="900" y="122" width="240" height="6" rx="3" fill="#64748b"/>
    <text x="1020" y="185" font-size="40" text-anchor="middle">💾</text>
    <text x="1020" y="224" font-size="17" font-weight="700" fill="#0f172a" text-anchor="middle">数据持久化</text>
    <text x="1020" y="252" font-size="12.5" fill="#475569" text-anchor="middle">JSON 文件存储</text>
    <text x="1020" y="274" font-size="12.5" fill="#475569" text-anchor="middle">配置 · 证书 · 审计日志</text>
  </g>

  <!-- 水平箭头 -->
  <line x1="280" y1="206" x2="308" y2="206" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#a-amber)"/>
  <text x="294" y="196" font-size="11" fill="#b45309" text-anchor="middle">访问</text>
  <line x1="870" y1="206" x2="898" y2="206" stroke="#64748b" stroke-width="2.5" marker-end="url(#a-slate)"/>
  <text x="884" y="196" font-size="11" fill="#475569" text-anchor="middle">持久化</text>

  <!-- 下发箭头 Manager→Agent -->
  <line x1="520" y1="290" x2="520" y2="358" stroke="#4f46e5" stroke-width="2.5" marker-end="url(#a-indigo)"/>
  <text x="536" y="318" font-size="12.5" font-weight="600" fill="#4338ca">DNS 配置 + Key + 证书</text>
  <text x="536" y="336" font-size="11" fill="#818cf8">AES-256 加密推送 · 热加载</text>

  <!-- 心跳箭头 Agent→Manager -->
  <line x1="650" y1="358" x2="650" y2="290" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#a-violet)"/>
  <text x="666" y="318" font-size="12.5" font-weight="600" fill="#6d28d9">心跳 · IP · 版本</text>
  <text x="666" y="336" font-size="11" fill="#a78bfa">状态上报</text>

  <!-- Agent 集群外框 -->
  <rect x="60" y="362" width="1080" height="206" rx="20" fill="#ffffff" opacity="0.55" stroke="#bae6fd" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="86" y="392" font-size="15" font-weight="700" fill="#0369a1">🛰️ 节点 Agent × N — 分布式部署</text>
  <text x="1114" y="392" font-size="12" fill="#64748b" text-anchor="end">跨平台 · Linux systemd / Windows 服务</text>

  <!-- Agent 子卡 -->
  <g filter="url(#shadow)">
    <rect x="90" y="404" width="320" height="140" rx="16" fill="url(#gradA)"/>
    <text x="114" y="444" font-size="18" font-weight="800" fill="#ffffff">🛰️ Agent 1</text>
    <rect x="114" y="460" width="272" height="34" rx="10" fill="#ffffff" opacity="0.2"/>
    <text x="130" y="483" font-size="12.5" fill="#ffffff">⚙️ 内嵌 ddns-go DNS 引擎</text>
    <text x="114" y="516" font-size="12.5" fill="#ffffff" opacity="0.95">📡 心跳 · IP · 版本上报</text>
    <text x="114" y="536" font-size="12.5" fill="#ffffff" opacity="0.95">🔑 配置 + Key + 证书热加载</text>

    <rect x="420" y="404" width="320" height="140" rx="16" fill="url(#gradA)"/>
    <text x="444" y="444" font-size="18" font-weight="800" fill="#ffffff">🛰️ Agent 2</text>
    <rect x="444" y="460" width="272" height="34" rx="10" fill="#ffffff" opacity="0.2"/>
    <text x="460" y="483" font-size="12.5" fill="#ffffff">⚙️ 内嵌 ddns-go DNS 引擎</text>
    <text x="444" y="516" font-size="12.5" fill="#ffffff" opacity="0.95">📡 心跳 · IP · 版本上报</text>
    <text x="444" y="536" font-size="12.5" fill="#ffffff" opacity="0.95">🔑 配置 + Key + 证书热加载</text>

    <rect x="750" y="404" width="320" height="140" rx="16" fill="url(#gradA)"/>
    <text x="774" y="444" font-size="18" font-weight="800" fill="#ffffff">🛰️ Agent N</text>
    <rect x="774" y="460" width="272" height="34" rx="10" fill="#ffffff" opacity="0.2"/>
    <text x="790" y="483" font-size="12.5" fill="#ffffff">⚙️ 内嵌 ddns-go DNS 引擎</text>
    <text x="774" y="516" font-size="12.5" fill="#ffffff" opacity="0.95">📡 心跳 · IP · 版本上报</text>
    <text x="774" y="536" font-size="12.5" fill="#ffffff" opacity="0.95">🔑 配置 + Key + 证书热加载</text>
  </g>

  <!-- Agent→DNS 箭头 -->
  <line x1="600" y1="568" x2="600" y2="598" stroke="#f97316" stroke-width="2.5" marker-end="url(#a-orange)"/>
  <text x="616" y="588" font-size="12" font-weight="600" fill="#ea580c">ddns-go 更新 DNS 记录</text>

  <!-- DNS 提供商卡 -->
  <g filter="url(#shadow)">
    <rect x="60" y="602" width="1080" height="120" rx="18" fill="url(#gradD)"/>
    <text x="88" y="646" font-size="21" font-weight="800" fill="#ffffff">☁️ DNS 提供商 × 28</text>
    <text x="88" y="670" font-size="13" fill="#ffffff" opacity="0.92">ddns-go DNS provider 直连 · A / AAAA 动态更新</text>
    <g font-size="12" fill="#ffffff">
      <rect x="88" y="684" width="112" height="30" rx="15" fill="#ffffff" opacity="0.2"/><text x="144" y="704" text-anchor="middle">Cloudflare</text>
      <rect x="212" y="684" width="88" height="30" rx="15" fill="#ffffff" opacity="0.2"/><text x="256" y="704" text-anchor="middle">DNSPod</text>
      <rect x="312" y="684" width="80" height="30" rx="15" fill="#ffffff" opacity="0.2"/><text x="352" y="704" text-anchor="middle">阿里云</text>
      <rect x="404" y="684" width="80" height="30" rx="15" fill="#ffffff" opacity="0.2"/><text x="444" y="704" text-anchor="middle">腾讯云</text>
      <rect x="496" y="684" width="96" height="30" rx="15" fill="#ffffff" opacity="0.2"/><text x="544" y="704" text-anchor="middle">GoDaddy</text>
      <rect x="604" y="684" width="120" height="30" rx="15" fill="#ffffff" opacity="0.2"/><text x="664" y="704" text-anchor="middle">HuaweiCloud</text>
      <rect x="736" y="684" width="72" height="30" rx="15" fill="#ffffff" opacity="0.2"/><text x="772" y="704" text-anchor="middle">OVH</text>
      <rect x="820" y="684" width="78" height="30" rx="15" fill="#ffffff" opacity="0.2"/><text x="859" y="704" text-anchor="middle">Vultr</text>
      <rect x="910" y="684" width="104" height="30" rx="15" fill="#ffffff" opacity="0.2"/><text x="962" y="704" text-anchor="middle">+ 更多</text>
    </g>
  </g>

  <!-- 底部说明 -->
  <text x="60" y="748" font-size="11.5" fill="#94a3b8">架构图仅供参考 · 组件与数据流基于 v1.6.64</text>
</svg>
