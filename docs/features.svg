<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="'Segoe UI','PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif" aria-labelledby="t d">
  <title id="t">DDNS-Manager 特性</title>
  <desc id="d">六大核心特性卡片</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f6ff"/>
      <stop offset="100%" stop-color="#e9f1ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>
  <circle cx="1120" cy="40" r="150" fill="#c7d2fe" opacity="0.30"/>
  <circle cx="80" cy="360" r="150" fill="#bae6fd" opacity="0.35"/>

  <!-- 卡片：x 起点 30/420/810，行 y 20/200，宽 360 高 160 -->
  <g filter="url(#shadow)">
    <!-- 1 集中管理 indigo -->
    <rect x="30" y="20" width="360" height="160" rx="14" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <rect x="30" y="20" width="360" height="9" rx="4.5" fill="#6366f1"/>
    <text x="210" y="72" font-size="32" text-anchor="middle">🗂️</text>
    <text x="210" y="104" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">集中管理</text>
    <text x="210" y="132" font-size="12.5" fill="#475569" text-anchor="middle">Web 仪表盘统一查看节点状态</text>
    <text x="210" y="152" font-size="12.5" fill="#475569" text-anchor="middle">IP · 版本 · 健康</text>

    <!-- 2 配置推送 sky -->
    <rect x="420" y="20" width="360" height="160" rx="14" fill="#ecfeff" stroke="#0ea5e9" stroke-width="2"/>
    <rect x="420" y="20" width="360" height="9" rx="4.5" fill="#0ea5e9"/>
    <text x="600" y="72" font-size="32" text-anchor="middle">📡</text>
    <text x="600" y="104" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">配置推送</text>
    <text x="600" y="132" font-size="12.5" fill="#475569" text-anchor="middle">DNS 配置 + Key 注入</text>
    <text x="600" y="152" font-size="12.5" fill="#475569" text-anchor="middle">→ Agent 热加载</text>

    <!-- 3 证书分发 violet -->
    <rect x="810" y="20" width="360" height="160" rx="14" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="810" y="20" width="360" height="9" rx="4.5" fill="#8b5cf6"/>
    <text x="990" y="72" font-size="32" text-anchor="middle">🔐</text>
    <text x="990" y="104" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">证书分发</text>
    <text x="990" y="132" font-size="12.5" fill="#475569" text-anchor="middle">SSL 证书 AES-256-GCM 加密推送</text>
    <text x="990" y="152" font-size="12.5" fill="#475569" text-anchor="middle">Agent 自动部署</text>

    <!-- 4 内嵌 DNS 引擎 orange -->
    <rect x="30" y="200" width="360" height="160" rx="14" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <rect x="30" y="200" width="360" height="9" rx="4.5" fill="#f97316"/>
    <text x="210" y="252" font-size="32" text-anchor="middle">⚙️</text>
    <text x="210" y="284" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">内嵌 DNS 引擎</text>
    <text x="210" y="312" font-size="12.5" fill="#475569" text-anchor="middle">Agent 同进程运行</text>
    <text x="210" y="332" font-size="12.5" fill="#475569" text-anchor="middle">ddns-go DNS provider</text>

    <!-- 5 跨平台 green -->
    <rect x="420" y="200" width="360" height="160" rx="14" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
    <rect x="420" y="200" width="360" height="9" rx="4.5" fill="#10b981"/>
    <text x="600" y="252" font-size="32" text-anchor="middle">🖥️</text>
    <text x="600" y="284" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">跨平台</text>
    <text x="600" y="312" font-size="12.5" fill="#475569" text-anchor="middle">Linux (systemd)</text>
    <text x="600" y="332" font-size="12.5" fill="#475569" text-anchor="middle">Windows 7+ (Windows Service)</text>

    <!-- 6 版本管理 amber -->
    <rect x="810" y="200" width="360" height="160" rx="14" fill="#fefce8" stroke="#f59e0b" stroke-width="2"/>
    <rect x="810" y="200" width="360" height="9" rx="4.5" fill="#f59e0b"/>
    <text x="990" y="252" font-size="32" text-anchor="middle">🔄</text>
    <text x="990" y="284" font-size="18" font-weight="700" fill="#0f172a" text-anchor="middle">版本管理</text>
    <text x="990" y="312" font-size="12.5" fill="#475569" text-anchor="middle">Git tag 驱动 + 符号链接安装</text>
    <text x="990" y="332" font-size="12.5" fill="#475569" text-anchor="middle">一键回滚</text>
  </g>
</svg>
